CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_EXTRA_EXCEPTION_INFO=y
#CONFIG_DEBUG_COREDUMP=y
#CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
#CONFIG_DEBUG_COREDUMP_BACKEND_OTHER=y

CONFIG_AT_CMD_PARSER=y
CONFIG_NEWLIB_LIBC=y
CONFIG_HEAP_MEM_POOL_SIZE=39000
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=1024

CONFIG_ASSERT=y

CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_MIN_TIMEOUT=1000
CONFIG_TASK_WDT_HW_FALLBACK=n

CONFIG_THREAD_NAME=y

# arm_math and FPU
CONFIG_CMSIS_DSP=y
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

CONFIG_USERSPACE=n
CONFIG_EVENTS=y

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BLOCK_IN_THREAD=y

# Hardware security
CONFIG_MBEDTLS=y
#CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
#CONFIG_MBEDTLS_USER_CONFIG_FILE="mbed_user_config.h"
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y

# Tag security
#CONFIG_MBEDTLS_MAC_POLY1305_ENABLED=y

# Direction Finding
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="AoA Bug"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y

CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV_SYNC=y
CONFIG_BT_OBSERVER=y

# Enable Direction Finding Feature including AoA and AoD
CONFIG_BT_DF=y
CONFIG_BT_DF_CONNECTIONLESS_CTE_RX=y
CONFIG_BT_CTLR_DF_CTE_RX_SAMPLE_1US=y
CONFIG_BT_CTLR_DF_CTE_RX=y
CONFIG_BT_CTLR_DF_ANT_SWITCH_RX=y

#CONFIG_BT_BUF_ACL_RX_COUNT=10
CONFIG_BT_BUF_ACL_RX_SIZE=300

CONFIG_REBOOT=y

# Should be in overlay but it's not picked up right now TODO
CONFIG_BT_CTLR=y
CONFIG_BT_LL_SW_SPLIT=y
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_SYNC_PERIODIC=y

# Enable Direction Finding Feature including AoA and AoD
CONFIG_BT_CTLR_DF=y

# Disable Direction Finding TX mode
CONFIG_BT_CTLR_DF_ANT_SWITCH_TX=n
CONFIG_BT_CTLR_DF_ADV_CTE_TX=n

CONFIG_BT_PER_ADV_SYNC_MAX=5
CONFIG_BT_CTLR_SYNC_PERIODIC_ADV_LIST=y
CONFIG_BT_CTLR_SYNC_PERIODIC_ADV_LIST_SIZE=10

CONFIG_BT_CTLR_DF_PER_SCAN_CTE_NUM_MAX=1
CONFIG_BT_CTLR_DF_MAX_ANT_SW_PATTERN_LEN=37
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=255
CONFIG_BT_CTLR_ADV_EXT_RX_PDU_LEN_MAX=255
CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=255

CONFIG_BT_CTLR_ADV_SYNC_SET=3

# Encoding of IQs in debug output mode
CONFIG_BASE64=y

# Use external LF Clock
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y

CONFIG_BT_CTLR_DF=y
CONFIG_BT_CTLR_DF_PER_ADV_CTE_NUM_MAX=1
CONFIG_BT_CTLR_DF_PER_SCAN_CTE_NUM_MAX=1

# Use same MCUBoot build as in customer modules (except with debug keys)
# Currently does not work, even with CONFIG_BOOT_SIGNATURE_KEY_FILE with absolute path.
# TODO: Currently local MCUBoot build will not start on modules without external LF CLOCK
#CONFIG_MCUBOOT_BUILD_STRATEGY_USE_HEX_FILE=y
#CONFIG_BOOT_SIGNATURE_KEY_FILE="root-rsa-2048.pem"

CONFIG_BT_CTLR_ADVANCED_FEATURES=y

#https://github.com/zephyrproject-rtos/zephyr/issues/50432#issuecomment-1262538539 keep to 1 due to bug
CONFIG_BT_CTLR_SCAN_AUX_SET=1

# See https://github.com/zephyrproject-rtos/zephyr/issues/49410#issuecomment-1224299769
CONFIG_BT_CTLR_SYNC_PERIODIC_SKIP_ON_SCAN_AUX=y

# See https://github.com/zephyrproject-rtos/zephyr/issues/49465#issuecomment-1231041478
CONFIG_BT_CTLR_SCAN_AUX_SYNC_RESERVE_MIN=n

# See https://github.com/zephyrproject-rtos/zephyr/issues/49915
CONFIG_BT_TICKER_LOW_LAT=n
#CONFIG_BT_TICKER_PRIORITY_SET=n
CONFIG_BT_CTLR_SCAN_UNRESERVED=n # Scan only when radio is free if y.
CONFIG_BT_CTLR_DF_VS_CL_IQ_REPORT_16_BITS_IQ_SAMPLES=y
CONFIG_BT_DF_VS_CL_IQ_REPORT_16_BITS_IQ_SAMPLES=y

CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_NRFX_PPI=y
#CONFIG_NRFX_GPIOTE=y
#CONFIG_BT_DEBUG_HCI_DRIVER=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n