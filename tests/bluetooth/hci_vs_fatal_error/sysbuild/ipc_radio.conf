# Report the fatal errors as Vendor Specific HCI events and reset afterwards.
CONFIG_BT_HCI_VS_FATAL_ERROR=y
CONFIG_RESET_ON_FATAL_ERROR=y

# Test-only fault injection hook, must never be enabled in a production image.
CONFIG_BT_HCI_RAW_CMD_EXT=y
CONFIG_ZERO_LATENCY_IRQS=y
CONFIG_IPC_RADIO_BT_FATAL_ERROR_TEST_HOOK=y
